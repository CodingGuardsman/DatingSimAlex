<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>After Class</title>
  <meta name="description" content="A sweet school romance about the last week before summer." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff7eb0'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white'>♥</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&family=Gaegu:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles/game.css?v=2.3.0" />
</head>
<body>
  <div id="game">
    <div id="stage">
      <div id="bg"></div>
      <div id="sprites"></div>
    </div>
    <div id="ui" style="display:none">
      <div id="choices"></div>
      <div id="say" class="narration">
        <div id="say-name"></div>
        <div id="say-text"></div>
        <div class="say-arrow"></div>
      </div>
      <div id="quick">
        <button data-q="log" title="Scroll up to read earlier dialogue"><span class="q-cute">Log</span><span class="q-wrong">Remember</span></button>
        <button data-q="auto"><span class="q-cute">Auto</span><span class="q-wrong">Stay</span></button>
        <button data-q="skip" title="Hold Ctrl to skip dialogue"><span class="q-cute">Skip</span><span class="q-wrong">Don't</span></button>
        <button data-q="book"><span class="q-cute">Scrapbook</span><span class="q-wrong">Evidence</span></button>
        <button data-q="save"><span class="q-cute">Save</span><span class="q-wrong">Save us</span></button>
        <button data-q="load"><span class="q-cute">Load</span><span class="q-wrong">Rewind</span></button>
        <button data-q="settings"><span class="q-cute">Settings</span><span class="q-wrong">Settings</span></button>
        <button data-q="title"><span class="q-cute">Main Menu</span><span class="q-wrong">Main Menu</span></button>
      </div>
    </div>
    <div id="fx"></div>
    <div id="screen"></div>
    <div id="reticle"></div>
  </div>
  <noscript>After Class needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js?v=2.3.0"></script>
</body>
</html>
